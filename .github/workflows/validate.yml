name: Validar PrimeShape

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/python/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/python/requirements-dev.txt
      - run: python scripts/download_models.py
      - run: python scripts/download_test_assets.py
      - run: python -m pytest
      - name: Validar JavaScript
        shell: bash
        run: for file in frontend/js/*.js; do node --check "$file" || exit 1; done
